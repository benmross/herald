<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herald setup</title>
<link rel="icon" href="/brand/favicon.png">
<style>
  /* Herald's look: an emulsion plate, Archivo, one blue. docs/brand/README.md. */
  @font-face {
    font-family: Archivo; src: url(/brand/archivo.woff2) format("woff2-variations");
    font-weight: 100 900; font-stretch: 62% 125%; font-display: swap;
  }
  :root {
    color-scheme: dark;
    --bg: #0a0c12; --panel: #11141c; --ink: #ecebe4; --muted: #9a9ca6;
    --line: #232837; --accent: #5b8cff; --accent-ink: #0a0c12;
    --ok: #7fc8a0; --warn: #e3c06a; --bad: #f08a80;
    --sans: Archivo, ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); }
  .wrap { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } aside { position: static !important; height: auto !important; } }

  aside {
    border-right: 1px solid var(--line); padding: 0 16px 28px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--bg);
  }
  .brand {
    display: flex; align-items: flex-end; gap: 12px; margin: 0 -16px 18px;
    padding: 56px 20px 18px; min-height: 130px;
    background: linear-gradient(to bottom, transparent 40%, var(--bg)), url(/brand/plate.jpg) 35% 50% / cover;
  }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  aside h1 {
    font: 800 26px/1 var(--sans); font-stretch: 125%; letter-spacing: -.03em; margin: 0;
  }
  aside p.sub { color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; margin: 4px 0 0; }
  ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  ol.steps li {
    display: flex; gap: 10px; align-items: baseline; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; font-size: 14px; border: 1px solid transparent;
  }
  ol.steps li:hover { background: var(--panel); }
  ol.steps li.current { background: color-mix(in oklab, var(--accent) 14%, transparent); border-color: color-mix(in oklab, var(--accent) 40%, transparent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; background: var(--line); }
  .dot.done { background: var(--ok); }
  .dot.partial { background: var(--warn); }
  .dot.blocked { background: var(--bad); }
  .stepname { flex: 1; }
  .stepdetail { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; }

  main { padding: 56px 48px 96px; max-width: 760px; }
  h2 { font: 800 34px/1.1 var(--sans); font-stretch: 112%; letter-spacing: -.02em; margin: 0 0 20px; }
  .prose h3, .prose h4 { font-weight: 700; margin: 22px 0 8px; }
  .prose p { margin: 0 0 14px; }
  .prose ul { margin: 0 0 14px; padding-left: 22px; }
  .prose li { margin: 0 0 6px; }
  .prose code {
    font: 13px/1.5 var(--mono); background: var(--panel); border: 1px solid var(--line);
    padding: 1px 5px; border-radius: 4px;
  }
  .prose pre {
    background: var(--panel); border: 1px solid var(--line);
    padding: 12px 14px; border-radius: 8px; overflow-x: auto; font: 13px/1.5 var(--mono);
  }
  .prose a, .note a { color: var(--accent); }
  .prose strong { font-weight: 700; }

  .field { margin: 24px 0; }
  .field label { display: block; font-weight: 650; margin-bottom: 5px; }
  .field .help { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  input[type=text], input[type=password], textarea, select {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); color: var(--ink); font: 15px/1.55 var(--sans);
  }
  textarea { line-height: 1.7; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid color-mix(in oklab, var(--accent) 70%, transparent); outline-offset: 1px; }
  .checkline { display: flex; gap: 10px; align-items: flex-start; }
  .checkline input { margin-top: 5px; width: 17px; height: 17px; flex: 0 0 17px; accent-color: var(--accent); }
  .checkline label { font-weight: 650; margin: 0; }

  .rowbtns { display: flex; gap: 10px; align-items: center; margin-top: 30px; }
  button {
    font: 650 15px/1 var(--sans); padding: 12px 20px; border-radius: 8px;
    border: 1px solid var(--accent); cursor: pointer; background: var(--accent); color: var(--accent-ink);
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
  button.ghost:hover { border-color: var(--muted); filter: none; }
  button[disabled] { opacity: .5; cursor: default; }
  .dictate { font-size: 13px; padding: 6px 11px; margin-top: 8px; }
  .dictate.on { background: var(--bad); border-color: var(--bad); color: #fff; }

  .note { margin-top: 26px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
  .note.ok { border-color: color-mix(in oklab, var(--ok) 45%, var(--line)); }
  .note.bad { border-color: color-mix(in oklab, var(--bad) 55%, var(--line)); }
  .note h4 { margin: 0 0 6px; font-size: 15px; }
  .note pre { white-space: pre-wrap; font: 12.5px/1.5 var(--mono); color: var(--muted); margin: 8px 0 0; }
  .warn { color: var(--warn); font-size: 14px; margin-top: 6px; }
  .signin { display: block; margin-top: 12px; word-break: break-all; font: 13px/1.5 var(--mono); }
  .counter { color: var(--muted); font-size: 13px; text-align: right; margin-top: 4px; }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; margin-right: 7px; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }

  /* The Telegram tour (setup/tutorial.py). Telegram's own dark palette, so the
     mock reads as the app someone is about to open. */
  .tour { margin: 8px 0 0; }
  .tour-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .tour-head h3 { margin: 0; font-size: 20px; font-weight: 750; }
  .tour-count { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .tour-caption { color: var(--ink); margin: 6px 0 14px; min-height: 52px; font-size: 15px; }
  .tg {
    --tg-bg: #0e1621; --tg-side: #17212b; --tg-me: #2b5278; --tg-bot: #182533;
    --tg-line: #0b121a; --tg-blue: #6ab3f3; --tg-muted: #708499;
    display: grid; grid-template-columns: 180px 1fr; height: 470px;
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--tg-bg);
    font: 14px/1.45 -apple-system, "Segoe UI", Roboto, var(--sans);
  }
  @media (max-width: 620px) { .tg { grid-template-columns: 1fr; } .tg-side { display: none; } }
  .tg-side { background: var(--tg-side); border-right: 1px solid var(--tg-line); overflow: hidden; }
  .tg-group { padding: 12px 14px; font-weight: 650; border-bottom: 1px solid var(--tg-line); }
  .tg-group small { display: block; color: var(--tg-muted); font-weight: 400; font-size: 12px; }
  .tg-topic { display: flex; gap: 9px; align-items: center; padding: 9px 14px; transition: background .3s; }
  .tg-topic i { width: 22px; height: 22px; border-radius: 50%; flex: 0 0 22px; font-style: normal;
    display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
  .tg-topic.active { background: #2b5278; }
  .tg-topic.born { animation: born .5s ease-out; }
  @keyframes born { from { opacity: 0; transform: translateX(-12px); } }
  .tg-main { display: flex; flex-direction: column; min-width: 0; }
  .tg-bar { padding: 10px 16px; background: var(--tg-side); border-bottom: 1px solid var(--tg-line); font-weight: 650; }
  .tg-bar small { display: block; color: var(--tg-muted); font-weight: 400; font-size: 12px; }
  .tg-pin { display: none; padding: 6px 16px; background: var(--tg-side); border-bottom: 1px solid var(--tg-line);
    font-size: 12.5px; color: var(--tg-muted); border-left: 3px solid var(--tg-blue); }
  .tg-pin b { color: var(--tg-blue); font-weight: 600; display: block; }
  .tg-pin.on { display: block; animation: born .4s ease-out; }
  .tg-log { flex: 1; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }
  .tg-msg { max-width: 78%; padding: 7px 11px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word;
    animation: pop .28s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
  .tg-msg.me { align-self: flex-end; background: var(--tg-me); border-bottom-right-radius: 4px; }
  .tg-msg.bot { align-self: flex-start; background: var(--tg-bot); border-bottom-left-radius: 4px; }
  .tg-msg.old { opacity: .62; animation: none; }
  .tg-msg .who { display: block; color: var(--tg-blue); font-weight: 600; font-size: 13px; }
  .tg-msg.mono .body { font: 12px/1.5 var(--mono); }
  .tg-msg.italic .body { font-style: italic; }
  .tg-msg.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 30% { box-shadow: 0 0 0 3px var(--tg-blue); } }
  .tg-quote { border-left: 2px solid var(--tg-blue); padding: 1px 0 1px 7px; margin-bottom: 4px;
    font-size: 12.5px; color: #c7d5e3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tg-cmd { color: var(--tg-blue); }
  .tg-event { align-self: center; background: rgba(0,0,0,.35); color: #dfe7ef; font-size: 12.5px;
    padding: 3px 11px; border-radius: 11px; animation: pop .28s ease-out; }
  .tg-keys { display: grid; gap: 4px; margin-top: 6px; }
  .tg-keys div { display: flex; gap: 4px; }
  .tg-keys span { flex: 1; text-align: center; padding: 6px 4px; border-radius: 7px; font-size: 13px;
    background: rgba(255,255,255,.08); transition: background .2s, transform .2s; }
  .tg-keys span.tapped { background: var(--tg-blue); color: #0e1621; transform: scale(.95); }
  .tg-typing { align-self: flex-start; background: var(--tg-bot); padding: 9px 13px; border-radius: 12px; }
  .tg-typing b { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%;
    background: var(--tg-muted); animation: dots 1s infinite; }
  .tg-typing b:nth-child(2) { animation-delay: .15s; } .tg-typing b:nth-child(3) { animation-delay: .3s; }
  @keyframes dots { 50% { opacity: .25; transform: translateY(-2px); } }
  .tg-compose { border-top: 1px solid var(--tg-line); background: var(--tg-side); padding: 8px 12px; }
  .tg-compose .q { display: none; margin-bottom: 6px; }
  .tg-compose .q.on { display: block; }
  .tg-input { display: flex; gap: 10px; align-items: center; }
  .tg-input span { flex: 1; color: var(--tg-muted); min-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tg-input span.typed { color: #e9eef3; }
  .tg-input span.typed::after { content: ""; display: inline-block; width: 1px; height: 15px; background: #e9eef3;
    vertical-align: -2px; margin-left: 1px; animation: dots .9s steps(1) infinite; }
  .tg-input em { width: 30px; height: 30px; border-radius: 50%; background: var(--tg-blue); flex: 0 0 30px;
    display: grid; place-items: center; font-style: normal; color: #0e1621; font-weight: 800; }
  .tour-nav { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .tour-nav button { padding: 8px 13px; font-size: 14px; }
  .tour-dots { display: flex; gap: 5px; flex-wrap: wrap; margin-left: auto; }
  .tour-dots button { width: 26px; height: 26px; padding: 0; border-radius: 50%; font-size: 12px;
    background: transparent; color: var(--muted); border-color: var(--line); }
  .tour-dots button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    .tg-msg, .tg-event, .tg-topic.born, .tg-pin.on { animation: none; }
    .tg-log { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <div class="brand">
      <img src="/brand/logo-256.png" alt="">
      <div><h1 id="agent">Herald</h1><p class="sub">setup</p></div>
    </div>
    <ol class="steps" id="steps"></ol>
  </aside>
  <main>
    <h2 id="title">…</h2>
    <div class="prose" id="blurb"></div>
    <form id="form"></form>
    <div class="rowbtns">
      <button id="go" type="button">Continue</button>
      <button id="skip" class="ghost" type="button">Skip this</button>
      <span id="working" style="display:none;color:var(--muted);font-size:14px"></span>
    </div>
    <div id="result"></div>
  </main>
</div>
<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const api = (path, opts = {}) => fetch(path + (path.includes("?") ? "&" : "?") + "token=" + TOKEN,
  Object.assign({headers: {"Content-Type": "application/json", "X-Herald-Token": TOKEN}}, opts));

let current = null, fields = [], recog = null;

/* Enough Markdown for these blurbs: headings, bold, code, links, bullets,
   indented blocks. A dependency for this would be absurd. */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function md(src) {
  const inline = s => esc(s)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
    .replace(/&lt;(https?:\/\/[^&]+)&gt;/g, '<a href="$1" target="_blank" rel="noreferrer">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:)]|$)/g, "$1<em>$2</em>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  const out = [];
  for (const block of src.split(/\n\s*\n/)) {
    const lines = block.split("\n");
    const solid = lines.filter(l => l.trim());
    if (solid.length && solid.every(l => /^ {4}|\t/.test(l))) {
      out.push("<pre>" + esc(block.replace(/^( {4}|\t)/gm, "")) + "</pre>");
    } else if (lines[0] && /^#{1,4} /.test(lines[0])) {
      const level = lines[0].match(/^#+/)[0].length;
      out.push(`<h${level + 2}>${inline(lines[0].replace(/^#+ /, ""))}</h${level + 2}>`);
      if (lines.length > 1) out.push("<p>" + inline(lines.slice(1).join(" ")) + "</p>");
    } else if (lines[0] && /^\s*[-*] /.test(lines[0])) {
      const items = [];
      let buf = "";
      for (const line of lines) {
        if (/^\s*[-*] /.test(line)) { if (buf) items.push(buf); buf = line.replace(/^\s*[-*] /, ""); }
        else buf += " " + line.trim();
      }
      if (buf) items.push(buf);
      out.push("<ul>" + items.map(i => "<li>" + inline(i) + "</li>").join("") + "</ul>");
    } else {
      out.push("<p>" + inline(lines.join(" ")) + "</p>");
    }
  }
  return out.join("\n");
}

function field(f) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  const id = "f_" + f.key;
  if (f.type === "tutorial") { tour(wrap, f.data || []); return wrap; }
  if (f.type === "note") {
    wrap.innerHTML = (f.label ? `<label>${esc(f.label)}</label>` : "") +
      `<div class="help">${md(f.help || "")}</div>`;
    return wrap;
  }
  if (f.type === "bool") {
    wrap.innerHTML = `<div class="checkline">
        <input type="checkbox" id="${id}" ${f.default ? "checked" : ""}>
        <div><label for="${id}">${esc(f.label)}</label>
        <div class="help">${md(f.help || "")}</div></div></div>`;
    return wrap;
  }
  let control;
  if (f.type === "choice") {
    control = `<select id="${id}">` + (f.choices || []).map(c =>
      `<option ${c === f.default ? "selected" : ""}>${esc(c)}</option>`).join("") + "</select>";
  } else if (f.type === "textarea") {
    control = `<textarea id="${id}" rows="${f.rows || 4}" placeholder="${esc(f.placeholder || "")}">${esc(f.default || "")}</textarea>`;
  } else {
    const type = f.type === "secret" ? "password" : "text";
    control = `<input type="${type}" id="${id}" value="${f.type === "secret" ? "" : esc(f.default || "")}" placeholder="${esc(f.placeholder || "")}">`;
  }
  wrap.innerHTML = (f.label ? `<label for="${id}">${esc(f.label)}${f.required ? " *" : ""}</label>` : "") +
    (f.help ? `<div class="help">${md(f.help)}</div>` : "") + control;
  if (f.type === "textarea" && f.dictate && ("webkitSpeechRecognition" in window || "SpeechRecognition" in window)) {
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "ghost dictate"; btn.textContent = "🎤 Dictate";
    btn.onclick = () => dictate(btn, wrap.querySelector("textarea"));
    wrap.appendChild(btn);
  }
  if (f.type === "textarea" && f.dictate) {
    const counter = document.createElement("div");
    counter.className = "counter";
    const ta = wrap.querySelector("textarea");
    const tick = () => {
      const n = (ta.value.trim().match(/\S+/g) || []).length;
      counter.textContent = n + " words";
      if (current === "interview") api("/api/draft", {method: "POST", body: JSON.stringify({piece: ta.value})});
    };
    ta.addEventListener("input", debounce(tick, 700));
    tick();
    wrap.appendChild(counter);
  }
  return wrap;
}

/* The Telegram tour. Each scene replays from its starting state: the topic
   list, the open topic and its earlier messages, then the steps one by one.
   `run` guards every await, so changing scene mid-animation stops the old one
   cleanly. With reduced motion, a scene is drawn complete and nothing advances
   on its own. */
let tourRun = 0;
function tour(root, scenes) {
  if (!scenes.length) return;
  const agent = document.getElementById("agent").textContent || "Herald";
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const colors = ["#e17076", "#7bc862", "#65aadd", "#faa774", "#a695e7", "#ee7aae"];
  root.className = "tour";
  root.innerHTML = `
    <div class="tour-head"><h3></h3><span class="tour-count"></span></div>
    <p class="tour-caption"></p>
    <div class="tg">
      <div class="tg-side"><div class="tg-group">${esc(agent)}<small>forum group</small></div><div class="tg-topics"></div></div>
      <div class="tg-main">
        <div class="tg-bar"><span class="tg-name"></span><small>topic</small></div>
        <div class="tg-pin"><b>Pinned message</b>How to use ${esc(agent)} here</div>
        <div class="tg-log"></div>
        <div class="tg-compose"><div class="tg-quote q"></div>
          <div class="tg-input"><span>Message</span><em>➤</em></div></div>
      </div>
    </div>
    <div class="tour-nav">
      <button type="button" class="ghost" data-k="prev">‹ Back</button>
      <button type="button" class="ghost" data-k="play">Pause</button>
      <button type="button" class="ghost" data-k="next">Next ›</button>
      <div class="tour-dots"></div>
    </div>`;
  const $ = sel => root.querySelector(sel);
  const log = $(".tg-log"), input = $(".tg-input span"), quote = $(".tg-compose .q");
  let index = 0, playing = !still;
  const playBtn = $('[data-k="play"]');
  playBtn.textContent = playing ? "Pause" : "Play";
  scenes.forEach((sc, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = i + 1; b.title = sc.title;
    b.onclick = () => show(i);
    $(".tour-dots").appendChild(b);
  });
  $('[data-k="prev"]').onclick = () => show(Math.max(0, index - 1));
  $('[data-k="next"]').onclick = () => show((index + 1) % scenes.length);
  playBtn.onclick = () => {
    playing = !playing; playBtn.textContent = playing ? "Pause" : "Play";
    if (playing) show(index);
  };

  const fmt = text => esc(text).replace(/(^|\s)(\/[a-z]+)/g, '$1<span class="tg-cmd">$2</span>');
  const topicItem = (name, i, born) => {
    const d = document.createElement("div");
    d.className = "tg-topic" + (born ? " born" : ""); d.dataset.name = name;
    d.innerHTML = `<i style="background:${colors[i % colors.length]}">${name === "General" ? "#" : esc(name[0])}</i>${esc(name)}`;
    return d;
  };
  const setActive = name => {
    $(".tg-name").textContent = name;
    root.querySelectorAll(".tg-topic").forEach(t => t.classList.toggle("active", t.dataset.name === name));
  };
  const scroll = () => { log.scrollTop = log.scrollHeight; };
  const bubble = (m, byId) => {
    if (m.who === "event") {
      const e = document.createElement("div"); e.className = "tg-event"; e.textContent = m.text; return e;
    }
    const d = document.createElement("div");
    d.className = `tg-msg ${m.who}` + (m.old ? " old" : "") + (m.mono ? " mono" : "") + (m.italic ? " italic" : "");
    const ref = m.reply_to && byId[m.reply_to];
    d.innerHTML = (m.who === "bot" ? `<span class="who">${esc(agent)}</span>` : "") +
      (ref ? `<div class="tg-quote">${esc(ref.text)}</div>` : "") + `<div class="body">${fmt(m.text)}</div>`;
    if (m.id) d.dataset.id = m.id;
    if (m.buttons) {
      const keys = document.createElement("div"); keys.className = "tg-keys";
      for (const row of m.buttons) {
        const r = document.createElement("div");
        for (const label of row) { const k = document.createElement("span"); k.textContent = label; r.appendChild(k); }
        keys.appendChild(r);
      }
      d.appendChild(keys);
    }
    return d;
  };

  async function show(i) {
    const run = ++tourRun;
    const alive = () => run === tourRun && root.isConnected;
    const wait = ms => new Promise(res => setTimeout(res, still ? 0 : ms));
    index = i;
    const sc = scenes[i];
    $(".tour-head h3").textContent = sc.title;
    $(".tour-count").textContent = `${i + 1} of ${scenes.length}`;
    $(".tour-caption").textContent = sc.caption;
    root.querySelectorAll(".tour-dots button").forEach((b, j) => b.classList.toggle("on", j === i));
    const topics = $(".tg-topics"); topics.innerHTML = "";
    sc.topics.forEach((t, j) => topics.appendChild(topicItem(t, j)));
    if (!sc.topics.includes(sc.topic) && !sc.steps.some(s => s.new_topic)) topics.appendChild(topicItem(sc.topic, sc.topics.length));
    setActive(sc.topic);
    $(".tg-pin").classList.remove("on");
    log.innerHTML = ""; input.textContent = "Message"; input.className = ""; quote.classList.remove("on");
    const byId = {};
    for (const m of sc.history || []) { if (m.id) byId[m.id] = m; log.appendChild(bubble(m, byId)); }
    scroll();
    let last = null;
    for (const m of sc.steps) {
      if (!alive()) return;
      await wait(700);
      if (!alive()) return;
      if (m.who === "event") {
        if (m.new_topic) { topics.appendChild(topicItem(m.new_topic, sc.topics.length, true)); setActive(m.new_topic); }
        log.appendChild(bubble(m, byId));
      } else if (m.who === "me") {
        const ref = m.reply_to && byId[m.reply_to];
        if (ref) {
          const target = log.querySelector(`[data-id="${m.reply_to}"]`);
          if (target) { target.classList.remove("old"); target.classList.add("flash"); target.scrollIntoView({block: "nearest"}); }
          quote.textContent = ref.text; quote.classList.add("on");
          await wait(900); if (!alive()) return;
        }
        input.className = "typed"; input.textContent = "";
        const step = Math.max(1, Math.ceil(m.text.length / 40));
        for (let c = 0; c < m.text.length && !still; c += step) {
          input.textContent = m.text.slice(0, c + step);
          await wait(32); if (!alive()) return;
        }
        await wait(250); if (!alive()) return;
        input.className = ""; input.textContent = "Message"; quote.classList.remove("on");
        last = bubble(m, byId); log.appendChild(last);
      } else {
        if (!m.edit) {
          const typing = document.createElement("div"); typing.className = "tg-typing";
          typing.innerHTML = "<b></b><b></b><b></b>"; log.appendChild(typing); scroll();
          await wait(m.progress ? 500 : 1000); typing.remove(); if (!alive()) return;
        }
        const b = bubble(m, byId);
        if (m.edit && last && last.classList.contains("bot")) { last.replaceWith(b); }
        else log.appendChild(b);
        last = b;
        if (m.pin) $(".tg-pin").classList.add("on");
        if (m.progress) {
          const body = b.querySelector(".body"), lines = m.text.split("\n");
          for (let n = 1; n <= lines.length && !still; n++) {
            body.textContent = lines.slice(0, n).join("\n"); scroll();
            await wait(800); if (!alive()) return;
          }
        }
        if (m.tap) {
          scroll(); await wait(1400); if (!alive()) return;
          const key = [...b.querySelectorAll(".tg-keys span")].find(k => k.textContent === m.tap);
          if (key) key.classList.add("tapped");
          await wait(500); if (!alive()) return;
        }
      }
      scroll();
    }
    if (!still) {
      await wait(5500);
      if (alive() && playing) show((i + 1) % scenes.length);
    }
  }
  // After the caller has put `root` on the page, which `alive` checks.
  setTimeout(() => show(0));
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* Dictation is the browser's own, on-device where the browser does it that way.
   Nothing is uploaded by this page: the audio never reaches Herald, only the
   text the browser hands back. */
function dictate(btn, textarea) {
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (recog) { recog.stop(); recog = null; btn.classList.remove("on"); btn.textContent = "🎤 Dictate"; return; }
  recog = new Rec();
  recog.continuous = true; recog.interimResults = false; recog.lang = navigator.language || "en-US";
  recog.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const text = e.results[i][0].transcript.trim();
        textarea.value += (textarea.value && !/\s$/.test(textarea.value) ? " " : "") + text;
        textarea.dispatchEvent(new Event("input"));
      }
    }
  };
  recog.onerror = () => { btn.classList.remove("on"); btn.textContent = "🎤 Dictate"; recog = null; };
  recog.onend = () => { if (recog) { btn.classList.remove("on"); btn.textContent = "🎤 Dictate"; recog = null; } };
  recog.start();
  btn.classList.add("on"); btn.textContent = "■ Stop";
}

function collect() {
  const answers = {};
  for (const f of fields) {
    if (f.type === "note" || f.type === "tutorial") continue;
    const el = document.getElementById("f_" + f.key);
    if (!el) continue;
    answers[f.key] = f.type === "bool" ? el.checked : el.value;
  }
  return answers;
}

async function load(step) {
  const r = await api("/api/state" + (step ? "?step=" + step : ""));
  const data = await r.json();
  current = data.current;
  document.getElementById("agent").textContent = data.agent || "Herald";
  document.getElementById("title").textContent = data.prompt.title;
  document.getElementById("blurb").innerHTML = md(data.prompt.blurb || "");
  document.getElementById("go").textContent = data.prompt.action || "Continue";
  document.getElementById("result").innerHTML = "";
  const form = document.getElementById("form");
  form.innerHTML = "";
  fields = data.prompt.fields || [];
  for (const f of fields) form.appendChild(field(f));

  const list = document.getElementById("steps");
  list.innerHTML = "";
  data.steps.forEach(s => {
    const li = document.createElement("li");
    li.className = s.key === current ? "current" : "";
    li.innerHTML = `<span class="dot ${s.status}"></span>
      <span class="stepname">${esc(s.title)}<span class="stepdetail">${esc(s.detail || "")}</span></span>`;
    li.onclick = () => load(s.key);
    list.appendChild(li);
  });
  const skip = document.getElementById("skip");
  const order = data.steps.map(s => s.key);
  skip.style.display = order.indexOf(current) < order.length - 1 ? "" : "none";
  skip.onclick = () => load(order[order.indexOf(current) + 1]);
}

async function go() {
  const button = document.getElementById("go");
  const working = document.getElementById("working");
  button.disabled = true;
  working.style.display = "";
  working.innerHTML = '<span class="spin"></span>working';
  const r = await api("/api/apply", {method: "POST",
    body: JSON.stringify({step: current, answers: collect()})});
  const {job} = await r.json();
  const result = document.getElementById("result");
  let shownUrl = false;
  let wait = 150;
  while (true) {
    await new Promise(res => setTimeout(res, wait));
    wait = Math.min(wait * 1.5, 1000);
    const state = await (await api("/api/job/" + job)).json();
    if (state.url && !shownUrl) {
      shownUrl = true;
      result.innerHTML = `<div class="note"><h4>Open this and sign in</h4>
        <a class="signin" href="${esc(state.url)}" target="_blank" rel="noreferrer">${esc(state.url)}</a>
        <p style="margin:10px 0 0;color:var(--muted);font-size:14px">
        Google will say the app is not verified. It is your own app, made
        minutes ago. Waiting for you to finish.</p></div>`;
    }
    if (state.state === "done") {
      const o = state.outcome || {};
      button.disabled = false;
      working.style.display = "none";
      result.innerHTML = `<div class="note ${o.ok ? "ok" : "bad"}">
        <h4>${o.ok ? "" : "That did not work. "}${esc(o.message || "")}</h4>
        ${o.detail ? `<pre>${esc(o.detail)}</pre>` : ""}
        ${(o.warnings || []).map(w => `<div class="warn">! ${esc(w)}</div>`).join("")}
      </div>`;
      if (o.ok) {
        const next = document.createElement("button");
        next.textContent = o.more ? "Next" : "Continue";
        next.style.marginTop = "16px";
        /* `more` means this step has another screen; otherwise let the
           server pick the next step that is not done. */
        next.onclick = () => load(o.more ? current : null);
        result.appendChild(next);
      }
      return;
    }
  }
}

document.getElementById("go").onclick = go;
load(null);
</script>
